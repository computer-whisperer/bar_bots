[package]
name = "arena"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "Batch evaluation: headless matches of our bot against BARb (arena) and unit-against-unit duels (duel)"

[dependencies]
bot-protocol = { path = "../bot-protocol" }
buildorder = { path = "../buildorder" }
flate2 = "1.1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
